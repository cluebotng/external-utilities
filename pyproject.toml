[project]
name = "external-utilities"
version = "1.0"
requires-python = ">=3.14,<4.0"
dependencies = [
    "python-openstackclient (>=10.5.0,<11.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = "^4.67.12"
tox-current-env = "^0.0.17"
black = "^26.10.1"
ruff = "^0.17.4"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
